; Firmware ARDMX4 EVO — ESP32 DevKit V1 + MAX485 (direcció automàtica) + Bluetooth Classic SPP
; + DFPlayer Mini (UART1). Equivalent funcional de l'ARDMX4 (Arduino Mega) amb un cor ESP32:
; 4 escenes DMX amb transicions, cicle sincronitzat amb música, fins a 510 canals.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; NVS ampliada a 64 KB — vegeu partitions.csv i el comentari a
; CHANNEL_CHUNK_SIZE a main.cpp (la partició de 20 KB per defecte es
; queda petita amb les dades + noms de fins a 510 canals).
board_build.partitions = partitions.csv
; PlatformIO no dedueix sol l'adreça de pujada de l'app a partir d'una
; taula de particions personalitzada — sense això, pujava el firmware a
; l'adreça per defecte (0x10000) tot i que app0 ara comença a 0x20000,
; deixant el dispositiu amb un binari vàlid a la posició equivocada.
board_upload.offset_address = 0x20000

monitor_speed = 115200

lib_deps =
    someweisguy/esp_dmx@^4.1.0
    dfrobot/DFRobotDFPlayerMini@^1.0.6
